# The checks: on every pull request, every push to main, and by hand.
#
# One of the two workflows here, named by when it runs; the other,
# release.yml, runs when a release is published, builds the apps and puts
# the website up. Nothing in this one hands anything to people, apart from
# a pull request's preview of the site on Vercel.
#
# The first job, `what changed`, reads the pull request's own diff once and
# says which of the rest it needs; every other job asks it rather than
# deciding for itself:
#
#   app (app · macos, app · windows, interface)  for anything but a change
#                                                to the site alone
#   site                                         for site/, ui/ (the site
#                                                draws with the interface's
#                                                components) and CHANGELOG.md
#                                                (its "What's new" line)
#   site · preview                               only for site/ itself (Alex,
#                                                2026-10-11), and for what
#                                                builds and puts it up
#                                                (.github/actions/site, this
#                                                file)
#
# A change to this file runs all of them, and so does a pull request git
# cannot read the diff of. A push to main runs the app's checks, as it
# always has; by hand, the app's and the site's. A job that is not needed
# shows as skipped under its own name: none of them is a matrix, since
# GitHub shows a skipped matrix job under its unexpanded name instead. main
# requires none of these checks today (its ruleset only stops it being
# deleted or force-pushed), so a skipped one holds nothing up.
#
# CodeQL also checks every pull request. It is GitHub's default setup
# (Settings, Code security), not a file here.

name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Reading the repository is all these need, bar the preview, which reads
# its own secrets. Said here because the default token can write, and a
# pull request from a fork runs this workflow.
permissions:
  contents: read

# A pull request's newer push replaces its older run. Every other run has a
# group of its own, so each push to main is checked: in a shared group a
# third push would cancel the second's waiting run.
concurrency:
  group: checks-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  changes:
    name: what changed
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.changes.outputs.app }}
      site: ${{ steps.changes.outputs.site }}
      preview: ${{ steps.changes.outputs.preview }}
    steps:
      - uses: actions/checkout@v7
        with:
          # A pull request's merge commit and the base it was merged onto,
          # so HEAD^1..HEAD is exactly what the pull request changes.
          fetch-depth: 2

      # The table at the top of this file. If git cannot say what changed,
      # everything runs: a check run for nothing costs minutes, a check
      # skipped for nothing lets a break through.
      - name: What it touches
        id: changes
        env:
          EVENT: ${{ github.event_name }}
        run: |
          app=false site=false preview=false
          # Each path whole, never quoted (-z), and a moved file as both
          # its old path and its new one (--no-renames): a file moved from
          # ui/ into site/ still runs the app's checks.
          list=$(mktemp)
          if [ "$EVENT" != pull_request ]; then
            app=true
            if [ "$EVENT" = workflow_dispatch ]; then site=true; fi
          elif ! git diff --no-renames --name-only -z HEAD^1 HEAD > "$list"; then
            echo "::warning::Could not tell what this pull request changes, so every check runs."
            app=true site=true preview=true
          else
            while IFS= read -r -d '' f; do
              case "$f" in
                site/*|.github/actions/site/*) site=true preview=true ;;
                .github/workflows/checks.yml)  app=true site=true preview=true ;;
                ui/*|CHANGELOG.md)             app=true site=true ;;
                *)                             app=true ;;
              esac
            done < "$list"
          fi
          echo "app=$app site=$site preview=$preview"
          { echo "app=$app"; echo "site=$site"; echo "preview=$preview"; } >> "$GITHUB_OUTPUT"

  # The app's Python suites on the two systems it is actually used on. They
  # need no sound card, screen or microphone (PortAudio is stubbed where the
  # audio is checked), so for a long time they ran on Linux, on the
  # reasoning that what they test is the same everywhere and Linux is the
  # quickest runner to get.
  #
  # It is not the same everywhere. A Mac's filesystem does not tell "Other"
  # from "other" and Linux's does, so a check written against exactly that
  # skipped itself on every push and reached main broken. Windows differs
  # again: a file open for playing cannot be moved, cp1252 has no Cyrillic,
  # and paths compare without case. Those branches are most of what breaks,
  # and a runner that never takes them has nothing to say about them.
  #
  # Two jobs and not a matrix, so that a skipped one keeps its name.
  app-macos:
    name: app · macos
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/app

      # The suites keep the MIDI library out so they never touch a port; this
      # is the one place it runs for real. On macOS it makes a virtual port,
      # plays 100 notes into it and pulls it; on Windows it lists what the
      # system has. See the top of the script.
      - name: The MIDI library on this machine
        run: python tests/midi_live.py

      # The entry point the docs tell people to use. Cheap, and it catches a
      # package that imports from a clone but not once installed.
      - name: Does it start
        run: python -m rehearsal_recorder --selftest

  app-windows:
    name: app · windows
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/app

      - name: The MIDI library on this machine
        run: python tests/midi_live.py

      - name: Does it start
        run: python -m rehearsal_recorder --selftest

  # The interface: the Vitest files beside the code, and Playwright against
  # the built bundle, headless against a faked Python side. Nothing in them
  # depends on the system underneath, so they run once, on Linux, the
  # quickest machine to get.
  interface:
    name: interface
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install
        run: npm ci

      # tsc -b first, so a type error fails here rather than as a test.
      - name: Build
        run: npm run build

      - name: Vitest
        run: npm test

      # --with-deps: on Linux the browser needs system libraries and fonts.
      - name: Install the browser
        run: npx playwright install --with-deps chromium

      - name: Playwright
        run: npm run test:e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: ui/playwright-report/
          if-no-files-found: ignore

  # The website, built and tested as a release would build it, so an
  # interface change that breaks the page shows up here, not on the day of
  # a release. In a pull request the version is the newest one in
  # CHANGELOG.md.
  site:
    name: site
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/site

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: site-playwright-report
          path: site/playwright-report/
          if-no-files-found: ignore

  # A pull request's build on Vercel as a preview, never production: the
  # pull request shows it as "View deployment", and it opens after logging
  # in to Vercel, with Vercel's toolbar for comments on the page. Only a pull
  # request that changes the site itself gets one (Alex, 2026-10-11). Secrets
  # reach a pull request only from a branch of this repository, so one from
  # a fork or from Dependabot is built and tested and gets no preview. It
  # needs the repository secrets VERCEL_TOKEN, VERCEL_ORG_ID and
  # VERCEL_PROJECT_ID, as the release's deploy does.
  preview:
    name: site · preview
    needs: [changes, site]
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]' &&
      needs.changes.outputs.preview == 'true'
    runs-on: ubuntu-latest
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: site

      - name: Deploy
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          url=$(npx --yes vercel@62.4.0 deploy site --token "$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "This pull request's site is at $url" >> "$GITHUB_STEP_SUMMARY"
